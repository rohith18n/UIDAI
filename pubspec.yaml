name: yellowsense_uidai
description: "YellowSense Technologies — UIDAI Contactless Fingerprint SDK Demo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  dio: ^5.4.3+1
  go_router: ^13.2.4
  google_fonts: ^8.1.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_image_compress: ^2.3.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo11.png
    - assets/images/app_logo.png
    - assets/images/app_logo_1024.png
    - assets/models/
